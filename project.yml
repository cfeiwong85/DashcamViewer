name: DashcamViewer
options:
  bundleIdPrefix: io.github.cfeiwong85
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  T8Kit:
    path: T8Kit
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  DashcamViewer:
    type: application
    platform: iOS
    sources:
      - path: DashcamViewer
    dependencies:
      - package: T8Kit
        product: T8Kit
    info:
      path: DashcamViewer/Info.plist
      properties:
        CFBundleDisplayName: Dashcam Viewer
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        NSLocalNetworkUsageDescription: Connects to your Eurostyle T8 dashcam over its Wi-Fi network (192.168.100.1).
        NSPhotoLibraryAddUsageDescription: Saves recordings and photos from the dashcam to your Photos library.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.cfeiwong85.DashcamViewer
        GENERATE_INFOPLIST_FILE: NO
        # Swift 5 language mode for the app: Network/AVFoundation Sendable annotations differ
        # between SDKs. T8Kit itself builds in Swift 6 strict mode (Package.swift).
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
  DashcamViewerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: DashcamViewerTests
    dependencies:
      - target: DashcamViewer
      - package: T8Kit
        product: T8Kit
      - package: T8Kit
        product: T8SimulatorKit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  DashcamViewer:
    build:
      targets:
        DashcamViewer: all
        DashcamViewerTests: [test]
    test:
      targets:
        - DashcamViewerTests
      gatherCoverageData: false
